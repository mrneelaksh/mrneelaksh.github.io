name: GENYOA Homepage Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch homepage only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          home_pos = html.find('id="home"')
          if home_pos < 0:
              raise SystemExit('id="home" not found')

          # Replace the first H1 after #home.
          h1_start = html.find("<h1", home_pos)
          h1_end = html.find("</h1>", h1_start)
          if h1_start < 0 or h1_end < 0:
              raise SystemExit("Homepage H1 not found")

          new_h1 = '<h1 id="heroHeadline" aria-label="WE TURN IDEAS INTO DIGITAL EXPERIENCES THAT STAND OUT."><span class="headline-typing" aria-hidden="true"></span></h1>'
          html = html[:h1_start] + new_h1 + html[h1_end + 5:]

          # Replace the first paragraph inside .hero-sub.
          hero_sub = html.find('class="hero-sub"')
          if hero_sub >= 0:
              p_start = html.find("<p", hero_sub)
              p_end = html.find("</p>", p_start)
              if p_start >= 0 and p_end >= 0:
                  new_p = '<p>Websites and digital experiences for businesses, brands & startups. Design-led. Technology-driven. Built around your brand.</p>'
                  html = html[:p_start] + new_p + html[p_end + 4:]

          # Add the canvas to the hero only.
          if 'id="genyoaInteractiveWaves"' not in html:
              anchor = html.find('<div class="hero-inner"', home_pos)
              if anchor < 0:
                  raise SystemExit('hero-inner not found')
              markup = '<div id="genyoaInteractiveWaves" class="genyoa-interactive-waves" aria-hidden="true"><canvas></canvas></div>\n'
              html = html[:anchor] + markup + html[anchor:]

          css_marker = "GENYOA HOMEPAGE CSS v1"
          if css_marker not in html:
              css = r'''
<style>
/* GENYOA HOMEPAGE CSS v1 */
.hero{isolation:isolate}
.hero .wave-field{display:none!important}
.hero .grid{opacity:.16!important;z-index:1}
.genyoa-interactive-waves{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;opacity:.44}
.genyoa-interactive-waves canvas{display:block;width:100%;height:100%}
.hero-inner{z-index:4}
#heroHeadline{min-height:2.65em}
.headline-typing{display:inline}
.headline-char{display:inline-block;opacity:0;transform:translateY(.14em);filter:blur(4px);will-change:opacity,transform,filter}
.headline-char.is-visible{opacity:1;transform:none;filter:none;transition:opacity .28s ease,transform .28s var(--ease),filter .28s ease}
.headline-char.space{width:.28em}
.headline-char.accent{color:var(--accent)}
@media(max-width:640px){
  .genyoa-interactive-waves{opacity:.34}
  #heroHeadline{min-height:3.25em}
}
@media(prefers-reduced-motion:reduce){
  .headline-char{opacity:1!important;transform:none!important;filter:none!important}
  .genyoa-interactive-waves{opacity:.20}
}
</style>
'''
              pos = html.rfind("</style>")
              if pos < 0:
                  raise SystemExit("</style> not found")
              html = html[:pos+8] + "\n" + css + html[pos+8:]

          js_marker = "GENYOA HOMEPAGE JS v1"
          if js_marker not in html:
              js = r'''
<script>
/* GENYOA HOMEPAGE JS v1 */
(function(){
  const reduce=window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const headline=document.getElementById("heroHeadline");
  const root=headline?.querySelector(".headline-typing");

  const parts=[
    {text:"WE TURN IDEAS INTO ",accent:false},
    {text:"DIGITAL EXPERIENCES",accent:true},
    {text:" THAT STAND OUT.",accent:false}
  ];

  function build(){
    if(!root)return [];
    root.textContent="";
    const chars=[];
    for(const part of parts){
      for(const char of [...part.text]){
        const s=document.createElement("span");
        s.className="headline-char"+(char===" "?" space":"")+(part.accent?" accent":"");
        s.textContent=char===" "?"\u00A0":char;
        root.appendChild(s);
        chars.push(s);
      }
    }
    return chars;
  }

  function startTyping(){
    const chars=build();
    if(reduce){chars.forEach(x=>x.classList.add("is-visible"));return;}
    chars.forEach((x,i)=>setTimeout(()=>x.classList.add("is-visible"),i*50));
  }

  function afterOpeningAnimation(){
    const selectors=["#preloader","#loader",".preloader",".loader",".intro-screen",".intro-overlay",".splash-screen"];
    const el=selectors.map(s=>document.querySelector(s)).find(x=>{
      if(!x)return false;
      const cs=getComputedStyle(x);
      return cs.display!=="none"&&cs.visibility!=="hidden"&&parseFloat(cs.opacity||"1")>.01;
    });
    if(!el){setTimeout(startTyping,650);return;}
    const begin=performance.now();
    const poll=()=>{
      const cs=getComputedStyle(el);
      const done=cs.display==="none"||cs.visibility==="hidden"||parseFloat(cs.opacity||"1")<=.01;
      if(done||performance.now()-begin>6000)setTimeout(startTyping,160);
      else requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }

  if(document.readyState==="complete")afterOpeningAnimation();
  else window.addEventListener("load",afterOpeningAnimation,{once:true});

  /* InteractiveWavesBackground-style Perlin-noise canvas, HOME ONLY. */
  const hero=document.getElementById("home");
  const host=document.getElementById("genyoaInteractiveWaves");
  const canvas=host?.querySelector("canvas");
  if(!hero||!host||!canvas)return;
  const ctx=canvas.getContext("2d",{alpha:true});
  if(!ctx)return;

  class Grad{
    constructor(x,y,z){this.x=x;this.y=y;this.z=z}
    dot2(x,y){return this.x*x+this.y*y}
  }
  class Noise{
    constructor(seed=Math.random()){
      this.g=[new Grad(1,1,0),new Grad(-1,1,0),new Grad(1,-1,0),new Grad(-1,-1,0),new Grad(1,0,1),new Grad(-1,0,1),new Grad(1,0,-1),new Grad(-1,0,-1),new Grad(0,1,1),new Grad(0,-1,1),new Grad(0,1,-1),new Grad(0,-1,-1)];
      this.p=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
      this.perm=new Array(512);this.gp=new Array(512);this.seed(seed);
    }
    seed(seed){
      if(seed>0&&seed<1)seed*=65536;
      seed=Math.floor(seed);
      if(seed<256)seed|=seed<<8;
      for(let i=0;i<256;i++){
        const v=i&1?this.p[i]^(seed&255):this.p[i]^((seed>>8)&255);
        this.perm[i]=this.perm[i+256]=v;
        this.gp[i]=this.gp[i+256]=this.g[v%12];
      }
    }
    fade(t){return t*t*t*(t*(t*6-15)+10)}
    lerp(a,b,t){return(1-t)*a+t*b}
    perlin2(x,y){
      let X=Math.floor(x),Y=Math.floor(y);
      x-=X;y-=Y;X&=255;Y&=255;
      const n00=this.gp[X+this.perm[Y]].dot2(x,y);
      const n01=this.gp[X+this.perm[Y+1]].dot2(x,y-1);
      const n10=this.gp[X+1+this.perm[Y]].dot2(x-1,y);
      const n11=this.gp[X+1+this.perm[Y+1]].dot2(x-1,y-1);
      const u=this.fade(x);
      return this.lerp(this.lerp(n00,n10,u),this.lerp(n01,n11,u),this.fade(y));
    }
  }

  const cfg={waveSpeedX:.02,waveSpeedY:.01,waveAmpX:40,waveAmpY:20,friction:.90,tension:.01,maxCursorMove:120,xGap:12,yGap:36};
  const noise=new Noise();
  const lines=[];
  const mouse={x:-9999,y:-9999,sx:-9999,sy:-9999,lx:0,ly:0,vs:0,a:0,set:false};

  function size(){
    const r=hero.getBoundingClientRect();
    const dpr=Math.min(devicePixelRatio||1,1.75);
    canvas.width=Math.max(1,Math.floor(r.width*dpr));
    canvas.height=Math.max(1,Math.floor(r.height*dpr));
    canvas.style.width=r.width+"px";
    canvas.style.height=r.height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    lines.length=0;
    const tw=Math.ceil((r.width+220)/cfg.xGap),th=Math.ceil((r.height+60)/cfg.yGap);
    const xs=(r.width-cfg.xGap*tw)/2,ys=(r.height-cfg.yGap*th)/2;
    for(let i=0;i<=tw;i++){
      const pts=[];
      for(let j=0;j<=th;j++)pts.push({x:xs+i*cfg.xGap,y:ys+j*cfg.yGap,wx:0,wy:0,cx:0,cy:0,vx:0,vy:0});
      lines.push(pts);
    }
  }

  function pointer(x,y){
    const r=hero.getBoundingClientRect();
    mouse.x=x-r.left;mouse.y=y-r.top;
    if(!mouse.set){mouse.sx=mouse.x;mouse.sy=mouse.y;mouse.lx=mouse.x;mouse.ly=mouse.y;mouse.set=true;}
  }

  function frame(t){
    const r=hero.getBoundingClientRect();
    mouse.sx+=(mouse.x-mouse.sx)*.1;
    mouse.sy+=(mouse.y-mouse.sy)*.1;
    const dx=mouse.x-mouse.lx,dy=mouse.y-mouse.ly,d=Math.hypot(dx,dy);
    mouse.vs+=(d-mouse.vs)*.1;
    mouse.vs=Math.min(100,mouse.vs);
    mouse.lx=mouse.x;mouse.ly=mouse.y;mouse.a=Math.atan2(dy,dx);

    for(const pts of lines){
      for(const p of pts){
        const move=noise.perlin2((p.x+t*cfg.waveSpeedX)*.002,(p.y+t*cfg.waveSpeedY)*.0015)*12;
        p.wx=Math.cos(move)*cfg.waveAmpX;p.wy=Math.sin(move)*cfg.waveAmpY;
        const ddx=p.x-mouse.sx,ddy=p.y-mouse.sy,dist=Math.hypot(ddx,ddy),l=Math.max(175,mouse.vs);
        if(mouse.set&&dist<l){
          const s=1-dist/l,f=Math.cos(dist*.001)*s;
          p.vx+=Math.cos(mouse.a)*f*l*mouse.vs*.00065;
          p.vy+=Math.sin(mouse.a)*f*l*mouse.vs*.00065;
        }
        p.vx+=-p.cx*cfg.tension;p.vy+=-p.cy*cfg.tension;
        p.vx*=cfg.friction;p.vy*=cfg.friction;
        p.cx+=p.vx*2;p.cy+=p.vy*2;
        p.cx=Math.max(-cfg.maxCursorMove,Math.min(cfg.maxCursorMove,p.cx));
        p.cy=Math.max(-cfg.maxCursorMove,Math.min(cfg.maxCursorMove,p.cy));
      }
    }

    ctx.clearRect(0,0,r.width,r.height);
    ctx.beginPath();ctx.strokeStyle="rgba(255,255,255,.10)";ctx.lineWidth=1;
    for(const pts of lines){
      let first=true;
      for(let i=0;i<pts.length;i++){
        const p=pts[i],last=i===pts.length-1;
        const x=p.x+p.wx+(last?0:p.cx),y=p.y+p.wy+(last?0:p.cy);
        if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
      }
    }
    ctx.stroke();
    requestAnimationFrame(frame);
  }

  window.addEventListener("mousemove",e=>pointer(e.clientX,e.clientY),{passive:true});
  window.addEventListener("touchmove",e=>{const t=e.touches[0];if(t)pointer(t.clientX,t.clientY)},{passive:true});
  window.addEventListener("resize",size,{passive:true});
  size();requestAnimationFrame(frame);
})();
</script>
'''
              pos = html.rfind("</script>")
              if pos < 0:
                  raise SystemExit("</script> not found")
              html = html[:pos] + "\n" + js + html[pos:]

          path.write_text(html,encoding="utf-8")
          print("Homepage patch prepared.")

          if "heroHeadline" not in html or "genyoaInteractiveWaves" not in html:
              raise SystemExit("Homepage patch verification failed.")

          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No new changes."
            exit 0
          fi
          git commit -m "Apply GENYOA homepage typing animation and interactive waves [skip ci]"
          git push
