name: GENYOA Homepage Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GENYOA homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # 1) Replace only the first H1 that appears after the homepage root.
          home_pos = html.find('id="home"')
          if home_pos < 0:
              raise SystemExit('Homepage root id="home" was not found.')

          h1_start = html.find("<h1", home_pos)
          if h1_start < 0:
              raise SystemExit("Homepage H1 was not found.")

          h1_end = html.find("</h1>", h1_start)
          if h1_end < 0:
              raise SystemExit("Homepage H1 closing tag was not found.")

          new_h1 = '''<h1 id="heroHeadline" aria-label="WE TURN IDEAS INTO DIGITAL EXPERIENCES THAT STAND OUT."><span class="headline-typing" aria-hidden="true"></span></h1>'''
          html = html[:h1_start] + new_h1 + html[h1_end + len("</h1>"):]

          # 2) Replace only the hero supporting paragraph.
          hero_sub_pos = html.find('class="hero-sub"')
          if hero_sub_pos >= 0:
              p_start = html.find("<p", hero_sub_pos)
              if p_start >= 0:
                  p_end = html.find("</p>", p_start)
                  if p_end >= 0:
                      new_p = '''<p>Websites and digital experiences for businesses, brands & startups. Design-led. Technology-driven. Built around your brand.</p>'''
                      html = html[:p_start] + new_p + html[p_end + len("</p>"):]

          # 3) Add the interactive Perlin-noise wave canvas to HOME only.
          if 'id="genyoaInteractiveWaves"' not in html:
              anchor = html.find('<div class="hero-inner"', home_pos)
              if anchor < 0:
                  raise SystemExit("Hero inner wrapper was not found.")
              waves_markup = '''<div id="genyoaInteractiveWaves" class="genyoa-interactive-waves" aria-hidden="true"><canvas></canvas></div>\n'''
              html = html[:anchor] + waves_markup + html[anchor:]

          # 4) Add the CSS once.
          css_marker = "/* GENYOA HOMEPAGE ENHANCEMENTS v1 */"
          if css_marker not in html:
              css = r'''<style>
/* GENYOA HOMEPAGE ENHANCEMENTS v1 */
.hero{isolation:isolate}
.hero::before{z-index:0}
.hero .grid{z-index:1;opacity:.18;pointer-events:none}
.hero .wave-field{display:none!important}
.genyoa-interactive-waves{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;opacity:.46}
.genyoa-interactive-waves canvas{display:block;width:100%;height:100%;pointer-events:none}
.hero-inner{z-index:4}
#heroHeadline{min-height:2.58em}
.headline-typing{display:inline}
.headline-char{display:inline-block;opacity:0;transform:translateY(.16em);filter:blur(5px);will-change:opacity,transform,filter}
.headline-char.is-visible{opacity:1;transform:translateY(0);filter:blur(0);transition:opacity .34s ease,transform .34s var(--ease),filter .34s ease}
.headline-char.space{display:inline-block;width:.28em}
.headline-char.accent{color:var(--accent)}
@media (max-width:640px){
  .genyoa-interactive-waves{opacity:.36}
  #heroHeadline{min-height:3.1em}
}
@media (prefers-reduced-motion:reduce){
  .headline-char{opacity:1!important;transform:none!important;filter:none!important}
  .genyoa-interactive-waves{opacity:.22}
}
</style>
'''
              style_pos = html.rfind("</style>")
              if style_pos < 0:
                  raise SystemExit("No closing </style> tag found.")
              html = html[:style_pos + len("</style>")] + "\n" + css + html[style_pos + len("</style>"):]

          # 5) Add the homepage typing + InteractiveWavesBackground-compatible canvas implementation once.
          js_marker = "// GENYOA HOMEPAGE ENHANCEMENTS v1"
          if js_marker not in html:
              js = r'''
<script>
/* GENYOA HOMEPAGE ENHANCEMENTS v1 */
(function(){
  const reduce = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const headline = document.getElementById("heroHeadline");
  const typingRoot = headline?.querySelector(".headline-typing");

  const headlineParts = [
    { text: "WE TURN IDEAS INTO ", accent: false },
    { text: "DIGITAL EXPERIENCES", accent: true },
    { text: " THAT STAND OUT.", accent: false }
  ];

  function buildHeadline(){
    if(!typingRoot) return 0;
    typingRoot.textContent = "";
    let total = 0;
    headlineParts.forEach(part=>{
      const group = document.createDocumentFragment();
      [...part.text].forEach(char=>{
        const span = document.createElement("span");
        span.className = "headline-char" + (char === " " ? " space" : "") + (part.accent ? " accent" : "");
        span.textContent = char === " " ? " " : char;
        group.appendChild(span);
        total++;
      });
      typingRoot.appendChild(group);
    });
    return total;
  }

  function revealHeadline(){
    const total = buildHeadline();
    if(!typingRoot) return;
    const chars = [...typingRoot.querySelectorAll(".headline-char")];
    if(reduce){
      chars.forEach(c=>c.classList.add("is-visible"));
      return;
    }
    chars.forEach((char,i)=>{
      window.setTimeout(()=>char.classList.add("is-visible"), i * 50);
    });
    // Keep the same 50ms cadence while making the following hero copy feel sequenced.
    const doneAt = Math.max(0,(total-1)*50) + 420;
    window.setTimeout(()=>{
      document.querySelector(".hero-sub")?.classList.add("hero-copy-ready");
      document.querySelector(".hero-actions")?.classList.add("hero-copy-ready");
    }, doneAt);
  }

  function waitForOpeningAnimation(){
    const selectors = ["#preloader","#loader",".preloader",".loader",".intro-screen",".intro-overlay",".splash-screen"];
    const candidate = selectors.map(sel=>document.querySelector(sel)).find(el=>{
      if(!el) return false;
      const cs = getComputedStyle(el);
      return cs.display !== "none" && cs.visibility !== "hidden" && parseFloat(cs.opacity || "1") > 0.01;
    });

    if(!candidate){
      window.setTimeout(revealHeadline, reduce ? 0 : 700);
      return;
    }

    const start = performance.now();
    const poll = ()=>{
      const cs = getComputedStyle(candidate);
      const gone = cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity || "1") <= 0.01;
      if(gone || performance.now()-start > 6000){
        window.setTimeout(revealHeadline, reduce ? 0 : 160);
      }else{
        requestAnimationFrame(poll);
      }
    };
    requestAnimationFrame(poll);
  }

  if(document.readyState === "complete") waitForOpeningAnimation();
  else window.addEventListener("load", waitForOpeningAnimation, {once:true});

  /* InteractiveWavesBackground-style implementation:
     Perlin noise + mouse-reactive point physics, scoped strictly to #home. */
  const root = document.getElementById("genyoaInteractiveWaves");
  const canvas = root?.querySelector("canvas");
  const hero = document.getElementById("home");
  if(!root || !canvas || !hero) return;

  class Grad{
    constructor(x,y,z){this.x=x;this.y=y;this.z=z}
    dot2(x,y){return this.x*x+this.y*y}
  }

  class Noise{
    constructor(seed=0){
      this.grad3=[
        new Grad(1,1,0),new Grad(-1,1,0),new Grad(1,-1,0),new Grad(-1,-1,0),
        new Grad(1,0,1),new Grad(-1,0,1),new Grad(1,0,-1),new Grad(-1,0,-1),
        new Grad(0,1,1),new Grad(0,-1,1),new Grad(0,1,-1),new Grad(0,-1,-1)
      ];
      this.p=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
      this.perm=new Array(512); this.gradP=new Array(512); this.seed(seed);
    }
    seed(seed){
      if(seed>0 && seed<1) seed*=65536;
      seed=Math.floor(seed);
      if(seed<256) seed|=seed<<8;
      for(let i=0;i<256;i++){
        const v=i&1 ? this.p[i]^(seed&255) : this.p[i]^((seed>>8)&255);
        this.perm[i]=this.perm[i+256]=v;
        this.gradP[i]=this.gradP[i+256]=this.grad3[v%12];
      }
    }
    fade(t){return t*t*t*(t*(t*6-15)+10)}
    lerp(a,b,t){return (1-t)*a+t*b}
    perlin2(x,y){
      let X=Math.floor(x),Y=Math.floor(y);
      x-=X;y-=Y;X&=255;Y&=255;
      const n00=this.gradP[X+this.perm[Y]].dot2(x,y);
      const n01=this.gradP[X+this.perm[Y+1]].dot2(x,y-1);
      const n10=this.gradP[X+1+this.perm[Y]].dot2(x-1,y);
      const n11=this.gradP[X+1+this.perm[Y+1]].dot2(x-1,y-1);
      const u=this.fade(x);
      return this.lerp(this.lerp(n00,n10,u),this.lerp(n01,n11,u),this.fade(y));
    }
  }

  const ctx=canvas.getContext("2d", {alpha:true});
  if(!ctx) return;

  const cfg={
    lineColor:"rgba(255,255,255,0.10)",
    waveSpeedX:0.02,
    waveSpeedY:0.01,
    waveAmpX:40,
    waveAmpY:20,
    friction:0.90,
    tension:0.01,
    maxCursorMove:120,
    xGap:12,
    yGap:36
  };

  const noise=new Noise(Math.random());
  const lines=[];
  const mouse={x:-1000,y:-1000,lx:0,ly:0,sx:-1000,sy:-1000,vs:0,a:0,set:false};

  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,1.8);
    const r=hero.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr);
    canvas.height=Math.floor(r.height*dpr);
    canvas.style.width=r.width+"px";
    canvas.style.height=r.height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildLines(r.width,r.height);
  }

  function buildLines(width,height){
    lines.length=0;
    const oWidth=width+220, oHeight=height+60;
    const totalLines=Math.ceil(oWidth/cfg.xGap);
    const totalPoints=Math.ceil(oHeight/cfg.yGap);
    const xStart=(width-cfg.xGap*totalLines)/2;
    const yStart=(height-cfg.yGap*totalPoints)/2;

    for(let i=0;i<=totalLines;i++){
      const pts=[];
      for(let j=0;j<=totalPoints;j++){
        pts.push({x:xStart+cfg.xGap*i,y:yStart+cfg.yGap*j,wave:{x:0,y:0},cursor:{x:0,y:0,vx:0,vy:0}});
      }
      lines.push(pts);
    }
  }

  function updatePoints(time){
    lines.forEach(points=>{
      points.forEach(p=>{
        const move=noise.perlin2((p.x+time*cfg.waveSpeedX)*0.002,(p.y+time*cfg.waveSpeedY)*0.0015)*12;
        p.wave.x=Math.cos(move)*cfg.waveAmpX;
        p.wave.y=Math.sin(move)*cfg.waveAmpY;

        const dx=p.x-mouse.sx, dy=p.y-mouse.sy;
        const dist=Math.hypot(dx,dy);
        const l=Math.max(175,mouse.vs);

        if(mouse.set && dist<l){
          const s=1-dist/l;
          const f=Math.cos(dist*0.001)*s;
          p.cursor.vx+=Math.cos(mouse.a)*f*l*mouse.vs*0.00065;
          p.cursor.vy+=Math.sin(mouse.a)*f*l*mouse.vs*0.00065;
        }

        p.cursor.vx+=(0-p.cursor.x)*cfg.tension;
        p.cursor.vy+=(0-p.cursor.y)*cfg.tension;
        p.cursor.vx*=cfg.friction;
        p.cursor.vy*=cfg.friction;
        p.cursor.x+=p.cursor.vx*2;
        p.cursor.y+=p.cursor.vy*2;
        p.cursor.x=Math.min(cfg.maxCursorMove,Math.max(-cfg.maxCursorMove,p.cursor.x));
        p.cursor.y=Math.min(cfg.maxCursorMove,Math.max(-cfg.maxCursorMove,p.cursor.y));
      });
    });
  }

  function draw(time){
    const r=hero.getBoundingClientRect();
    const width=r.width, height=r.height;
    ctx.clearRect(0,0,width,height);
    ctx.beginPath();
    ctx.strokeStyle=cfg.lineColor;
    ctx.lineWidth=1;

    lines.forEach(points=>{
      let first=true;
      points.forEach((p,idx)=>{
        const last=idx===points.length-1;
        const x=p.x+p.wave.x+(last?0:p.cursor.x);
        const y=p.y+p.wave.y+(last?0:p.cursor.y);
        if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
      });
    });
    ctx.stroke();
  }

  function pointerMove(x,y){
    const r=hero.getBoundingClientRect();
    mouse.x=x-r.left; mouse.y=y-r.top;
    if(!mouse.set){
      mouse.sx=mouse.x; mouse.sy=mouse.y;
      mouse.lx=mouse.x; mouse.ly=mouse.y; mouse.set=true;
    }
  }

  function tick(time){
    if(!document.hidden){
      mouse.sx+=(mouse.x-mouse.sx)*0.10;
      mouse.sy+=(mouse.y-mouse.sy)*0.10;
      const dx=mouse.x-mouse.lx, dy=mouse.y-mouse.ly;
      const d=Math.hypot(dx,dy);
      mouse.vs+=(d-mouse.vs)*0.10;
      mouse.vs=Math.min(100,mouse.vs);
      mouse.lx=mouse.x;mouse.ly=mouse.y;
      mouse.a=Math.atan2(dy,dx);
      updatePoints(time);
      draw(time);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener("mousemove",e=>pointerMove(e.clientX,e.clientY),{passive:true});
  window.addEventListener("touchmove",e=>{
    const t=e.touches[0]; if(t) pointerMove(t.clientX,t.clientY);
  },{passive:true});
  window.addEventListener("resize",resize,{passive:true});

  resize();
  requestAnimationFrame(tick);
})();
</script>
'''
              script_pos = html.rfind("</script>")
              if script_pos < 0:
                  raise SystemExit("No closing </script> tag found.")
              html = html[:script_pos] + "\n" + js + html[script_pos:]

          # 6) Make the post-type hero copy subtly appear without touching other sections.
          if "hero-copy-ready" not in html:
              ready_css = r'''<style>
.hero-sub,.hero-actions{transition:opacity .55s ease,transform .55s var(--ease),filter .55s ease}
.hero-sub:not(.hero-copy-ready),.hero-actions:not(.hero-copy-ready){opacity:.78}
.hero-copy-ready{opacity:1}
</style>
'''
              style_pos = html.rfind("</style>")
              html = html[:style_pos + len("</style>")] + "\n" + ready_css + html[style_pos + len("</style>"):]

          path.write_text(html, encoding="utf-8")

      - name: Commit homepage changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes were needed."
            exit 0
          fi
          git commit -m "Update GENYOA homepage animation and waves [skip ci]"
          git push
